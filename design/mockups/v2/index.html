  if (/sunset/.test(s) && /end|finish|close/.test(s)) return { short: 'Ended on the sunset', op: (x) => { const d = x.parts[x.parts.length - 1]; d.shots[d.shots.length - 1] = mkShot(37, 2.4); return x } }
  if (/calm|slower|breathe|slow down/.test(s)) return { short: `${curPart().name}: slower`, op: (x) => { const p = x.parts.find((q) => q.id === ED.part) || x.parts[0]; p.shots.forEach((sh) => { sh.d = Math.round(sh.d * 1.15 * 100) / 100 }); p.pace = 1; return x } }
  if (/music|song|track/.test(s)) { const nx = musicFor(b.look).fits.find((id) => id !== b.music); return { short: `Music: ${TRACKS[nx].t}`, music: true, op: (x) => { x.music = nx; x.musicPicked = true; return x }, diff: [`Music: ${trackName(b.music)} → ${trackName(nx)}`].concat(musicDiff(b.music, nx)) } }
  const m = s.match(/remove .*?(morning|campus|library|park|dinner)/)
  if (m) { const p = b.parts.find((q) => q.id === m[1]); if (p && p.shots.length <= 2) return { refuse: `${p.name} has only 2 shots.` }; if (p) return { short: `Removed a shot from ${p.name}`, op: (x) => { const q = x.parts.find((y) => y.id === p.id); q.shots.pop(); return x } } }
  return null
}
function ask(q) {
  if (ED.thinking) return
  ED.thinking = true; ED.asking = q; renderAsk()
  later(() => {
    ED.thinking = false
    const r = interpret(q)
    if (!r) failTurn({ icon: '✦', typed: true, line: `You asked: ‘${q}’`, said: 'I couldn’t turn that into a change. Nothing changed.', sugg: ['Make the opening shorter', 'Remove the words in Park'] })
    else if (r.refuse) failTurn({ icon: '✦', typed: true, line: `You asked: ‘${q}’`, said: `Couldn’t: ${r.refuse}` })
    else {
      const t = turn({ icon: '✦', typed: true, req: q, line: `You asked: ‘${q}’`, short: r.short, op: r.op, diff: r.diff })
      if (t) toast(t.diff[0], { label: 'Undo', fn: () => undoTurn(t.id) })
      else failTurn({ icon: '✦', typed: true, line: `You asked: ‘${q}’`, said: 'Couldn’t: that’s already the case. Nothing changed.' })
    }
    const last = SES.turns[SES.turns.length - 1]
    if (last && last.fail) { ED.drawer = true; renderHist() }
    renderAsk(); const i = $('#askIn'); if (i) i.focus()
  }, 1300)
}

/* ------------------------------------------------------------ S7 · Fine-tune frames */
const FR = { sel: null, snapped: false, zoom: 'fit', zoomFmt: '', recenter: true }
const MOVES = [3.1, 9.4, 12.2, 19.6, 27.3, 33.8]
SCREENS.frames = (v) => {
  if (!SES.ready) newSession({ seeded: true })
  const fl = flatten(SES.board)
  if (!fl.shots.find((s) => s.id === FR.sel)) FR.sel = (fl.shots.find((s) => s.n === 35) || fl.shots[1] || fl.shots[0]).id
  FR.recenter = true
  editorShell(v, true)
  const s = fl.shots.find((x) => x.id === FR.sel); if (s) ED.player.seek(s.t0 + s.d * 0.55)
}
function framesRefresh() { editRefresh() }
function selShot() { return flatten(SES.board).shots.find((s) => s.id === FR.sel) }
function framePanel() {
  const s = selShot(), L = LOOKS[SES.board.look]
  if (!s) return '<h4>Pick a shot</h4><div class="sub">Tap a shot on the timeline.</div>'
  const cur = s.join || 'cut'
  const opts = [['cut', 'Straight cut']].concat(L.joins.slice(1).map((n) => [/fade|dip|grey/i.test(n) ? (/dip/i.test(n) ? 'dip' : /grey/i.test(n) ? 'dip' : 'fade') : /leak/i.test(n) ? 'leak' : /flash/i.test(n) ? 'flash' : /whip/i.test(n) ? 'whip' : 'cut', n]))
  return `<div class="frame-panel"><div class="caps">Shot</div><div class="fp-h" style="margin-top:6px">${s.clip}</div>
    <div class="fp-sub">${s.d.toFixed(1)} s · from 0:${s.n === 35 ? '12.3' : pad2(Math.floor(+s.from)) + '.' + String(s.from).split('.')[1]} in the clip</div>
    <div class="sub">${esc(s.label)} · in ${esc(SES.board.parts[s.pi].name)}</div>
    <div class="acts">
      <button class="btn btn-quiet" data-act="fr-split">Split here <kbd>S</kbd></button>
      <button class="btn btn-quiet" data-act="fr-trim" data-e="start">Trim start to here</button>
      <button class="btn btn-quiet" data-act="fr-trim" data-e="end">Trim end to here</button>
      <button class="btn btn-ghost btn-danger" data-act="fr-remove">Remove</button>
    </div>
    <div class="kv"><span>Join into this shot</span><select class="sel" id="joinSel" ${s.si === 0 && s.pi === 0 ? 'disabled' : ''}>${opts.map(([v, n]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <p class="faint" style="font-size:12px;margin-top:16px">Snaps to cuts, beats and movement · hold ⌥ to move freely</p></div>`
}
function renderTimeline() {
  const el = $('#tline'); if (!el || !ED.player) return
  const b = SES.board, fl = flatten(b), T = fl.total, L = LOOKS[b.look], joins = resolveJoins(b, fl)
  // long edits open zoomed to about a minute around the selected shot, and scroll sideways; Short opens fitted
  if (FR.zoomFmt !== b.fmt) { FR.zoom = b.fmt === 'short' ? 'fit' : 60; FR.zoomFmt = b.fmt; FR.recenter = true }
  const prev = $('#tlScroll'), keep = prev && !FR.recenter ? prev.scrollLeft : null
  const avail = Math.max(200, el.clientWidth - 40), span = FR.zoom === 'fit' ? T : Math.min(T, FR.zoom), px = Math.round((avail * T) / span)
  const pct = (t) => ((t / T) * 100).toFixed(4) + '%'
  const beat = 60 / 92, beats = []; for (let t = 0.2; t < T; t += beat) beats.push(t)
  const cuts = fl.shots.slice(1).map((s) => s.t0)
  const jAt = (s) => { if (s.join) return s.join; if (s.si === 0 && s.pi > 0) { const j = joins[s.pi - 1]; return j ? j.type : 'cut' } return 'cut' }
  const lab = [1, 2, 5, 10, 15, 30, 60, 120].find((st) => (st / T) * px >= 46) || 120, tick = lab >= 30 ? lab / 5 : lab >= 5 ? 1 : lab / 2
  // word chips: a chip too narrow for its words shows its glyph; glyphs closer than 14 px merge into one chip ("§¶")
  const chips = []
  for (const w of fl.words) {
    const d = Math.max(0.6, w.t1 - w.t0), x = (w.t0 / T) * px, wpx = (d / T) * px, g = wpx < 60, last = chips[chips.length - 1]
    if (g && last && last.g && x - last.x < 14) { last.items.push(w); last.end = Math.max(last.end, x + wpx); continue }
    chips.push({ g, x, end: x + wpx, items: [w] })
  }
  const chipHTML = (c) => {
    const w0 = c.items[0], tip = c.items.map((w) => `${w.label || 'Words'}: ${w.text || 'Name this place'}`).join(' · ')
    if (!c.g) return `<div class="tl-word" title="${esc(tip)}" style="left:${c.x.toFixed(1)}px;width:${(c.end - c.x).toFixed(1)}px">${esc(w0.text || 'Name this place')}</div>`
    const gl = [...new Set(c.items.map((w) => w.g || 'T'))].join('')
    return `<div class="tl-word glyph" title="${esc(tip)}" style="left:${c.x.toFixed(1)}px;width:${Math.max(c.end - c.x, 8 + 9 * gl.length).toFixed(1)}px">${esc(gl)}</div>`
  }
  const Z = [['fit', 'Fit'], [60, '1 min'], [10, '10 s']]
  el.innerHTML = `
    <div class="tl-zoom" role="radiogroup" aria-label="Zoom">${Z.map(([z, n]) => `<button class="${FR.zoom === z ? 'on' : ''}" role="radio" aria-checked="${FR.zoom === z}" data-act="fr-zoom" data-z="${z}" ${z !== 'fit' && z >= T ? 'disabled style="opacity:.4"' : ''}>${n}</button>`).join('')}</div>
    <div class="tl-scroll" id="tlScroll"><div class="tl-inner" id="tlInner" style="width:${px}px">
    <div class="ruler">${Array.from({ length: Math.floor(T / tick) + 1 }, (_, k) => { const i = Math.round(k * tick * 100) / 100, on = Math.abs(i / lab - Math.round(i / lab)) < 1e-6; return `<i style="left:${pct(i)};height:${on ? 9 : 5}px"></i>${on ? `<span style="left:${pct(i)}${i === 0 ? ';transform:none' : ''}">${clockT(i)}</span>` : ''}` }).join('')}</div>
    <div class="tl-ticks">${cuts.map((t) => `<i class="cut" style="left:${pct(t)}"></i>`).join('')}${MOVES.filter((t) => t < T).map((t) => `<i class="mov" style="left:${pct(t)}"></i>`).join('')}</div>
    <div class="trk-pic">${fl.shots.map((s) => `<div class="tl-shot ${s.id === FR.sel ? 'sel' : ''} ${(s.d / T) * px < 72 ? 'narrow' : ''}" data-act="fr-shot" data-id="${s.id}" title="${esc(s.label)} · ${s.d.toFixed(1)} s" style="left:calc(${pct(s.t0)} + 1px);width:calc(${pct(s.d)} - 2px);background-image:url('${IMG(s.n)}')"><span>${esc(s.label)}</span></div>`).join('')}
      ${fl.shots.slice(1).map((s) => { const j = jAt(s); if (j === 'cut' && (s.d / T) * px < 34) return ''; return `<span class="tl-join ${j !== 'cut' ? 'sp' : ''}" style="left:${pct(s.t0)}">${joinName(j, L)}</span>` }).join('')}</div>
    <div class="trk-words">${chips.map(chipHTML).join('')}</div>
    <div class="trk-mus"><canvas id="tlWave" style="position:absolute;inset:0;width:100%;height:100%"></canvas>${beats.map((t) => `<i style="position:absolute;left:${pct(t)};bottom:0;width:1px;height:10px;background:#93b08866"></i>`).join('')}</div>
    <div class="tl-ph" id="tlPH"></div></div></div>`
  const cv = $('#tlWave'); if (cv) {
    // at most 16k px wide however far it's zoomed (a canvas has a size limit); the bars stretch with it
    const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.min(16000, Math.round(px * d)); cv.height = Math.round(48 * d)
    const c = cv.getContext('2d'), W = cv.width, H = cv.height, Tr = TRACKS[b.music], n = Math.floor(W / 4)
    c.clearRect(0, 0, W, H)
    fl.parts.forEach((p, i) => { c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(`--part-${(i % 6) + 1}`).trim() + '22'; c.fillRect((p.t0 / T) * W, 0, ((p.t1 - p.t0) / T) * W, H) })
    for (let i = 0; i < n; i++) { const u = i / n, e = Tr ? Tr.e[Math.min(9, Math.floor(u * 10))] : 0.15, h = (0.2 + e * 0.8) * (0.4 + 0.6 * Math.abs(Math.sin(i * 1.3) * Math.cos(i * 0.21))) * H * 0.8; c.fillStyle = Tr ? '#93b088aa' : '#72695d88'; c.fillRect(i * 4, (H - h) / 2, 2.5, h) }
  }
  const sc = $('#tlScroll'), sel = fl.shots.find((x) => x.id === FR.sel)
  if (keep != null) sc.scrollLeft = keep
  else if (sel) sc.scrollLeft = Math.max(0, ((sel.t0 + sel.d / 2) / T) * px - sc.clientWidth / 2)
  FR.recenter = false
  movePH(ED.player.t, false)
  const ph = $('#tlPH')
  let down = false
  const at = (e) => {
    const r = $('.trk-pic', el).getBoundingClientRect()
    let t = clamp(((e.clientX - r.left) / r.width) * T, 0, T)
    FR.snapped = false
    if (!e.altKey) { const ticks = cuts.concat(beats, MOVES), pps = r.width / T; let best = null; for (const k of ticks) { const d = Math.abs(k - t) * pps; if (d <= 8 && (!best || d < best.d)) best = { k, d } } if (best) { t = best.k; FR.snapped = true } }
    ED.player.pause(); ED.player.seek(t); movePH(t, FR.snapped)
  }
  ph.addEventListener('pointerdown', (e) => { down = true; ph.setPointerCapture(e.pointerId); e.stopPropagation() })
  ph.addEventListener('pointermove', (e) => { if (down) at(e) })
  ph.addEventListener('pointerup', () => { down = false })
  $('.ruler', el).addEventListener('pointerdown', (e) => at(e))
  const js = $('#joinSel'); if (js) js.addEventListener('change', () => setJoin(js.value))
}
function movePH(t, snapped) {
  const ph = $('#tlPH'); if (!ph || !ED.player) return
  ph.style.left = `calc(${((t / ED.player.total) * 100).toFixed(4)}% - 1px)`
  ph.classList.toggle('snapped', !!snapped)
  // while playing, keep the playhead in view when zoomed in
  const sc = $('#tlScroll'); if (!sc || !ED.player.playing || sc.scrollWidth <= sc.clientWidth + 1) return
  const x = (t / ED.player.total) * sc.scrollWidth - sc.scrollLeft
  if (x < 0 || x > sc.clientWidth - 24) sc.scrollLeft = (t / ED.player.total) * sc.scrollWidth - sc.clientWidth * 0.2
}
ACT['fr-zoom'] = (el) => { const z = el.dataset.z; FR.zoom = z === 'fit' ? 'fit' : +z; FR.recenter = true; renderTimeline() }
ACT['fr-shot'] = (el) => { FR.sel = el.dataset.id; const s = selShot(); if (s) { ED.player.pause(); ED.player.seek(s.t0 + s.d / 2) } ED.part = SES.board.parts[s.pi].id; renderTimeline(); renderPanel(); renderRail() }
function shotOp(line, short, fn) {
  const s = selShot(); if (!s) return
  const sid = s.id
  const t = turn({ icon: '●', line, short, req: short, op: (x) => { for (const p of x.parts) { const i = p.shots.findIndex((q) => q.id === sid); if (i >= 0) return fn(p, i, x) === SKIP ? SKIP : x } return SKIP } })
  if (t) toast(t.diff[0], { label: 'Undo', fn: () => undoTurn(t.id) })
  else toast('Put the playhead inside the shot first.')
}
ACT['fr-split'] = () => {
  const s = selShot(); if (!s) return
  const at = ED.player.t - s.t0
  shotOp(`You split ${s.clip} at ${clockT(ED.player.t)}`, `Split ${s.clip}`, (p, i) => { if (at < 0.2 || at > s.d - 0.2) return SKIP; const a = p.shots[i]; const b2 = Object.assign({}, a, { id: uid('s'), d: Math.round((a.d - at) * 100) / 100 }); a.d = Math.round(at * 100) / 100; p.shots.splice(i + 1, 0, b2) })
}
ACT['fr-trim'] = (el) => {
  const s = selShot(); if (!s) return
  const at = ED.player.t - s.t0, start = el.dataset.e === 'start'
  shotOp(`You trimmed the ${start ? 'start' : 'end'} of ${s.clip}`, `Trimmed ${s.clip}`, (p, i) => { if (at < 0.15 || at > s.d - 0.15) return SKIP; p.shots[i].d = Math.round((start ? s.d - at : at) * 100) / 100 })
}
ACT['fr-remove'] = () => {
  const s = selShot(); if (!s) return
  const p = SES.board.parts[s.pi]
  if (p.shots.length <= 2) { toast(`Couldn’t: ${p.name} has only ${p.shots.length} shots.`); failTurn({ icon: '●', line: `You asked to remove ${s.clip}`, said: `Couldn’t: ${p.name} has only ${p.shots.length} shots.` }); return }
  shotOp(`You removed ${s.clip}`, `Removed ${s.clip}`, (pp, i) => { pp.shots.splice(i, 1) })
}
function setJoin(v) {
  const s = selShot(); if (!s) return
  const sid = s.id, L = LOOKS[SES.board.look]
  const t = turn({ icon: '●', line: `Join into ${s.clip}: ${joinName(v, L)}`, short: `Join: ${joinName(v, L)}`, req: 'join',
    op: (x) => { for (const p of x.parts) { const q = p.shots.find((y) => y.id === sid); if (q) { q.join = v; return x } } return SKIP }, diff: [`Join into ${s.clip}: ${joinName(v, L)}${SPECIAL.has(v) ? ' · counts toward the vibe’s special joins' : ''}`] })
  if (t) { toast(t.diff[0], { label: 'Undo', fn: () => undoTurn(t.id) }); ED.player.seek(Math.max(0, s.t0 - 0.8)); ED.player.o.stopAt = s.t0 + 0.8; ED.player.play() }
}
/* =====================================================================
   Part 6: review menu, keys, boot. The motion library lives in motion.html
   (one library, one place to sign off); ?s=gallery forwards there.
   ===================================================================== */
/* ------------------------------------------------------------ review menu (mockup chrome, not product UI) */
const DEV = { open: false }
function renderDev() {
  const d = $('#dev'); if (!d) return
  const L = (q, t) => `<a href="?${q}">${t}</a>`
  const S = (s, states, extra = '') => states.map((st) => L(`s=${s}${st ? '&state=' + st : ''}${extra}`, `${s}${st ? ' <small>· ' + st + '</small>' : ''}`)).join('')
  d.innerHTML = `<button data-act="dev" title="Mockup v2: jump to any screen or state">Screens ${DEV.open ? '▾' : '▴'}</button>${DEV.open ? `<div class="dp">
    <p>Clickable end to end from “clips”. Each link opens one screen or state (also works as ?s=…&state=…).</p>
    <h6>Flow</h6>${S('clips', ['', 'reading', 'done', 'notices', 'too-few', 'returning'])}
    ${S('format', ['', 'wide-into-upright', 'upright-into-wide', 'short-footage', 'still-reading'])}
    ${S('vibe', ['', 'low-confidence', 'still-reading', 'more', 'no-music', 'kind-changed'])}${L('s=vibe&learned=1&look=learned', 'vibe <small>· after a video I love</small>')}
    ${S('love', ['drop', 'link-pasted', 'reading', 'card', 'guard', 'too-short', 'mismatch', 'unreadable'])}
    ${S('making', ['', 'no-music', 'short-footage', 'failed-clips'])}${L('s=making&state=part-ready&fmt=long', 'making <small>· part-ready (long)</small>')}
    ${S('watch', ['', 'no-findings', 'left-out-open', 'what-i-did', 'restyling'])}${L('s=watch&state=finishing&fmt=long', 'watch <small>· finishing (long)</small>')}${L('s=watch&fmt=youtube', 'watch <small>· YouTube 16:9</small>')}${L('s=watch&look=film', 'watch <small>· Film</small>')}
    ${S('export', ['', 'gate-open', 'ready', 'exporting', 'done'])}${L('s=export&state=error&err=space', 'export <small>· error: space</small>')}${L('s=export&state=error&err=stopped', 'export <small>· error: stopped</small>')}${L('s=export&state=error&err=effect', 'export <small>· error: effect</small>')}${L('s=export&child=1', 'export <small>· child warning</small>')}${L('s=export&music=open_plan', 'export <small>· track needs credit</small>')}${L('s=export&fmt=youtube', 'export <small>· YouTube</small>')}
    <h6>Studio</h6>${S('edit', ['', 'no-key', 'thinking', 'couldnt', 'undo-dependent', 'preview-track'])}${L('s=edit&history=open', 'edit <small>· history open</small>')}${L('s=edit&tab=words', 'edit <small>· words</small>')}${L('s=edit&tab=music', 'edit <small>· music</small>')}${L('s=edit&fmt=youtube', 'edit <small>· YouTube</small>')}
    ${['offline-nofolder', 'reading-folder', 'missing', 'nothing-fits'].map((m) => L(`s=edit&tab=music&mstate=${m}`, `edit <small>· music: ${m}</small>`)).join('')}
    ${S('frames', [''])}<a href="motion.html">motion library <small>· motion.html</small></a>
    <h6>Talking to camera</h6>${L('s=vibe&kind=talking', 'vibe')}${L('s=vibe&kind=talking&state=speech-unavailable', 'vibe <small>· no speech reading</small>')}${L('s=vibe&kind=talking&state=no-talking', 'vibe <small>· no talking heard</small>')}${L('s=making&kind=talking', 'making')}${L('s=watch&kind=talking', 'watch')}${L('s=edit&kind=talking&tab=words', 'edit <small>· what you said</small>')}${L('s=edit&kind=talking&tab=words&state=script-lines', 'edit <small>· script lines</small>')}${L('s=edit&kind=talking&tab=part', 'edit <small>· part</small>')}${L('s=export&kind=talking&state=gate-open', 'export <small>· gate</small>')}
    <h6>Other kinds and vibes</h6>${L('s=watch&kind=quiet_day', 'watch <small>· a quiet day · Cozy</small>')}${L('s=watch&kind=trip&look=hype', 'watch <small>· a trip · Hype</small>')}${L('s=watch&kind=places_guide', 'watch <small>· places worth saving</small>')}${L('s=watch&kind=story_day&fmt=long', 'watch <small>· a story · long</small>')}${L('s=watch&look=playful', 'watch <small>· Playful</small>')}
  </div>` : ''}`
}
ACT.dev = () => { DEV.open = !DEV.open; renderDev() }

/* ------------------------------------------------------------ global input */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]')
  if (POP && !e.target.closest('.pop') && !(POP._anchor && POP._anchor.contains(e.target))) closePop()
  if (DEV.open && !e.target.closest('#dev')) { DEV.open = false; renderDev() }
  if (!a || a.disabled) return
  const fn = ACT[a.dataset.act]
  if (fn) fn(a, e)
})
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')
  if (e.key === 'Escape') {
    if (POP) { closePop(); return }
    if ($('#layer').innerHTML) { if (EX.open) ACT['ex-close'](); else if ($('.love')) ACT['love-close'](); else if ($('#loPop')) ACT['lo-close'](); return }
    if (ED.drawer && APP.s === 'edit') { ED.drawer = false; renderHist(); return }
    return
  }
  if (typing) return
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && ['edit', 'frames', 'watch'].includes(APP.s)) {
    e.preventDefault()
    if (e.shiftKey) { const u = [...SES.turns].reverse().find((t) => t.undone && !t.noUndo); if (u) redoTurn(u.id); else toast('Nothing to redo.') }
    else { const l = lastActive(); if (l) undoTurn(l.id); else toast('Nothing to undo.') }
    return
  }
  if (e.key === ' ') { const P = APP.s === 'watch' ? WT.player : APP.s === 'edit' || APP.s === 'frames' ? ED.player : null; if (P) { e.preventDefault(); P.toggle() } }
  if (APP.s === 'frames' && e.key.toLowerCase() === 's' && !e.metaKey && !e.ctrlKey) ACT['fr-split']()
})

/* ------------------------------------------------------------ boot */
function boot() {
  if (APP.s === 'gallery') { location.replace('motion.html' + location.search); return } // one motion library, not two
  for (let i = 0; i < 42; i++) pic(i)
  Object.values(HERO).forEach((h) => pic(h[0]))
  if (document.fonts && document.fonts.load) ['400 20px "EB Garamond"', 'italic 400 20px "EB Garamond"', '500 20px "EB Garamond"', '700 20px "Nunito"', '800 20px "Nunito"'].forEach((f) => document.fonts.load(f).catch(() => {}))
  if (!SCREENS[APP.s]) APP.s = 'clips'
  APP.made = ['making', 'watch', 'export', 'edit', 'frames'].includes(APP.s)
  if (APP.s === 'vibe' && APP.look === 'learned' && !APP.learned) APP.learned = { file: 'beach_day.mp4', uses: 0 }
  render()
  requestAnimationFrame(loop)
}
boot()
