     Imagery is the creator's own stills in ../assets. Motion is our own library, in the spirit of Overlay Studio: behaviour only. -->

@font-face { font-family: "Nunito"; font-weight: 800; src: url(../../../web/frontend/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format("woff2"); }

/* ================================================================== tokens (round 1, unchanged) */
:root {
  --bg: #13110e; --surface: #1a1714; --raised: #221e1a; --hover: #2a251f; --line: #322c25; --line-soft: #28231e;
  --text: #efe8dd; --muted: #a59b8d; --faint: #72695d;
  --accent: #c9dcc1; --accent-ink: #18221a; --accent-deep: #93b088; --accent-glow: #c9dcc11f;
  --warn: #e9c78f; --danger: #e59c8f;
  --serif: "EB Garamond", Georgia, serif;
  --sans: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
  --r: 12px; --r-lg: 18px;
  /* round 2 additions */
  --stage: #0c0b09; --r-xl: 22px;
  --shadow-video: 0 30px 80px #0008; --shadow-sheet: 0 40px 120px #000a;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-1: 150ms; --dur-2: 250ms; --dur-3: 600ms;
  --part-1: #c9dcc1; --part-2: #e8c39e; --part-3: #a7c4a0; --part-4: #d9b8c4; --part-5: #b9c7d9; --part-6: #e0d3a8;
  --ok: var(--accent-deep);
  --top: 60px; --rail: 280px; --panel: 360px; --strip: 88px; --hist: 32px; --ask: 48px;
  --hatch: repeating-linear-gradient(45deg, #1f1b17 0 5px, #2a251f 5px 10px);
  /* vibe font stacks (bundled in the product; system fallbacks here) */
  --f-inter: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-caveat: "Caveat", "Bradley Hand", "Marker Felt", cursive;
  --f-courier: "Courier Prime", "Courier New", monospace;
  --f-poppins: "Poppins", "Nunito", "Avenir Next Rounded", "Arial Rounded MT Bold", sans-serif;
  --f-anton: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-dseg: "DSEG7 Classic", Menlo, monospace;
}

/* ================================================================== looks.css (one class per vibe) */
.look-clean     { --look-filter: none; --m-curve: cubic-bezier(0.22,1,0.36,1); --m-dur: 800ms; --m-steps: none; --m-stagger: 160ms; --m-hold: 2s;
                  --w-1: #FFFFFF; --w-2: #F2C14E; --w-3: #B9D9EB; --f-display: var(--f-inter); --f-text: var(--f-inter); }
.look-cozy      { --look-filter: sepia(.14) saturate(.9) contrast(.9) brightness(1.04); --m-curve: cubic-bezier(0.16,1,0.3,1); --m-dur: 1150ms; --m-steps: steps(14); --m-stagger: 150ms; --m-hold: 2s;
                  --w-1: #F6EBD9; --w-2: #F3C9A5; --w-3: #C9DCC1; --f-display: var(--f-caveat); --f-text: var(--serif); }
.look-quiet     { --look-filter: saturate(.72) contrast(.86) brightness(1.05) sepia(.08); --m-curve: cubic-bezier(0.45,0,0.55,1); --m-dur: 1200ms; --m-steps: none; --m-stagger: 240ms; --m-hold: 3s;
                  --w-1: #EFE8DD; --w-2: #D8CBB6; --w-3: #FFFFFF; --f-display: var(--serif); --f-text: var(--f-inter); }
.look-cinematic { --look-filter: contrast(.94) saturate(.9) brightness(.97); --m-curve: cubic-bezier(0.45,0,0.55,1); --m-dur: 1000ms; --m-steps: none; --m-stagger: 240ms; --m-hold: 2.5s;
                  --w-1: #FFFFFF; --w-2: #E9D8B8; --w-3: #BFD0DA; --f-display: var(--f-inter); --f-text: var(--serif); }
.look-film      { --look-filter: contrast(.88) saturate(.85) sepia(.22) brightness(1.03); --m-curve: linear; --m-dur: 375ms; --m-steps: steps(3); --m-stagger: 40ms; --m-hold: 2s;
                  --w-1: #F5EEDC; --w-2: #FF9A3C; --w-3: #E8D5A8; --f-display: var(--f-courier); --f-text: var(--f-courier); }
.look-playful   { --look-filter: saturate(1.3) brightness(1.05) contrast(1.02); --m-curve: cubic-bezier(0.34,1.56,0.64,1); --m-dur: 500ms; --m-steps: none; --m-stagger: 70ms; --m-hold: 1s;
                  --w-1: #FFD84D; --w-2: #FF6FA8; --w-3: #7BD3F7; --f-display: var(--f-poppins); --f-text: var(--f-poppins); }
.look-hype      { --look-filter: contrast(1.18) saturate(1.12) brightness(.96); --m-curve: cubic-bezier(0.16,1,0.3,1); --m-dur: 150ms; --m-steps: none; --m-stagger: 70ms; --m-hold: 1s;
                  --w-1: #FFFFFF; --w-2: #FF6A3D; --w-3: #E8FF5A; --f-display: var(--f-anton); --f-text: var(--f-inter); }
.look-learned   { --look-filter: sepia(.2) saturate(.86) contrast(.88) brightness(1.05); --m-curve: cubic-bezier(0.16,1,0.3,1); --m-dur: 1150ms; --m-steps: steps(14); --m-stagger: 150ms; --m-hold: 2s;
                  --w-1: #F6EBD9; --w-2: #F3C9A5; --w-3: #C9DCC1; --f-display: var(--f-caveat); --f-text: var(--serif); }
.graded { filter: var(--look-filter); }

/* ================================================================== base */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; }
img { display: block; }
canvas { display: block; }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .warn { color: var(--warn); } .danger { color: var(--danger); } .okc { color: var(--ok); }
.nowrap { white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.hide { display: none !important; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-glow), 0 0 0 1px var(--accent-deep); border-radius: 8px; }
::selection { background: #93b08855; }
.eyebrow { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
h1.display { font-family: var(--serif); font-weight: 400; font-size: 52px; line-height: 1.05; letter-spacing: -.015em; margin-top: 10px; }
h1.display em, h2 em { color: var(--accent); font-style: italic; }
.lede { color: var(--muted); font-size: 16px; margin-top: 12px; max-width: 580px; }
.link { color: var(--accent-deep); text-decoration: underline; text-decoration-color: #93b08866; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--accent); }
.qlink { color: var(--muted); cursor: pointer; }
.qlink:hover { color: var(--text); }

/* ------------------------------------------------------------------ buttons: primary / quiet / ghost */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; font-weight: 550; font-size: 13.5px; transition: background var(--dur-1), opacity var(--dur-1), color var(--dur-1); white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: #d8e8d1; }
.btn-quiet { background: var(--raised); color: var(--text); }
.btn-quiet:hover { background: var(--hover); }
.btn-ghost { color: var(--muted); padding: 0 10px; }
.btn-ghost:hover { color: var(--text); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { color: #f3b6ab; }
.btn-sm { height: 28px; padding: 0 12px; font-size: 12.5px; }
.btn-lg { height: 44px; padding: 0 22px; font-size: 15px; }
.btn[disabled], .btn.is-off { opacity: .38; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--raised); font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
button.chip:hover { background: var(--hover); color: var(--text); }
.chip.warnc { color: var(--warn); }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; letter-spacing: .02em; background: var(--raised); color: var(--muted); white-space: nowrap; }
.tag.acc { background: #93b08826; color: var(--accent); }
.tag.warnt { background: #e9c78f22; color: var(--warn); }
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 2px; border: 1px solid var(--line-soft); }
.seg button { height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: 0 1px 0 #ffffff08 inset; }
.seg button:hover:not(.on) { color: var(--text); }
.tabs { display: flex; gap: 2px; background: var(--surface); padding: 3px; border-radius: 999px; border: 1px solid var(--line-soft); }
.tabs button { flex: 1; height: 30px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.tabs button.on { background: var(--raised); color: var(--text); }
.tabs button:hover:not(.on) { color: var(--text); }
.toggle { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--line); flex-shrink: 0; transition: background var(--dur-1); cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform var(--dur-2) var(--ease), background var(--dur-1); }
.toggle.on { background: var(--accent-deep); }
.toggle.on::after { transform: translateX(12px); background: var(--accent-ink); }
.check { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--faint); font-size: 11px; line-height: 1; flex-shrink: 0; cursor: pointer; }
.check.on { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--accent-ink); }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: var(--raised); outline: none; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text); cursor: pointer; }
.range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: 0; cursor: pointer; }
.spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #93b08844; border-top-color: var(--accent); animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 4px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.divider { height: 1px; background: var(--line-soft); margin: 18px 0; }
.caps { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
select.sel { height: 30px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); padding: 0 28px 0 10px; font-size: 13px; color: var(--text); appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 13px, calc(100% - 9px) 13px; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }

/* ================================================================== shell */
.app { display: grid; grid-template-rows: var(--top) minmax(0, 1fr); height: 100vh; }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--line-soft); position: relative; z-index: 30; background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.logo { font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.logo span { color: var(--accent-deep); font-style: italic; }
.project { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: baseline; gap: 6px; }
.project::before { content: "/"; margin-right: 6px; color: var(--faint); }
button.project:hover { color: var(--text); }
.stepper { display: flex; align-items: center; gap: 4px; }
.step { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; color: var(--faint); font-size: 13px; cursor: default; white-space: nowrap; }
.step i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid currentColor; font-style: normal; font-size: 11px; }
.step.done { color: var(--muted); cursor: pointer; } .step.done i { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--accent-ink); }
.step.now { color: var(--text); background: var(--raised); } .step.now i { border-color: var(--accent); color: var(--accent); }
.step.done:hover { color: var(--text); }
.step .count { font-size: 11px; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.sep { width: 18px; height: 1px; background: var(--line); }
.top-right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.privacy { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.privacy::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-deep); }
.view { position: relative; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; min-height: 0; animation: screenIn var(--dur-2) var(--ease); }
@keyframes screenIn { from { opacity: 0; } to { opacity: 1; } }
.scroll { overflow: auto; }

/* popovers & menus */
.pop { position: absolute; z-index: 60; background: #221e1a; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px #000b; padding: 6px; min-width: 220px; animation: popIn var(--dur-2) var(--ease); }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.pop .mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; font-size: 13px; color: var(--text); }
.pop .mi:hover { background: var(--hover); }
.pop .mi small { display: block; color: var(--faint); font-size: 11.5px; }
.pop .mi .r { margin-left: auto; color: var(--faint); font-size: 12px; }
.pop .mh { padding: 6px 10px 4px; }
.pop .msep { height: 1px; background: var(--line-soft); margin: 4px 6px; }
.pop.pad { padding: 16px; }
.pop .pad { padding: 10px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none; background: #2b261f; border: 1px solid var(--line); padding: 8px 8px 8px 18px; border-radius: 999px; display: flex; gap: 14px; align-items: center; transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease); z-index: 90; box-shadow: 0 20px 50px #0008; font-size: 13.5px; max-width: 760px; }
.toast.on { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast.noact { padding-right: 18px; }
body[data-s="edit"] .toast { bottom: 96px; }
body[data-s="frames"] .toast { bottom: auto; top: 72px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: #0009; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 70; display: grid; place-items: center; animation: screenIn var(--dur-2) var(--ease); padding: 20px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-sheet); overflow: hidden; animation: sheetIn var(--dur-2) var(--ease); position: relative; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(12px) scale(.985); } }
.sheet .close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 16px; z-index: 2; }
.sheet .close:hover { background: var(--raised); color: var(--text); }

/* ================================================================== player */
.vid { position: relative; overflow: hidden; background: #000; border-radius: 14px; box-shadow: var(--shadow-video); flex-shrink: 0; }
.vid canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.vid canvas.pic { filter: var(--look-filter); }
.vid .snap { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity var(--dur-2) linear; }
.vid .safe { position: absolute; border: 1px dashed #ffffff4d; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity var(--dur-2); }
.vid .notch { position: absolute; background: repeating-linear-gradient(45deg, #ffffff10 0 4px, transparent 4px 8px); border-left: 1px dashed #ffffff40; pointer-events: none; opacity: 0; transition: opacity var(--dur-2); }
.vid.show-safe .safe, .vid.show-safe .notch { opacity: 1; }
.vid .facebox { position: absolute; border: 1.5px dashed var(--warn); border-radius: 6px; pointer-events: none; }
.vid .facebox span { position: absolute; left: -2px; top: -22px; font-size: 11px; color: var(--warn); white-space: nowrap; background: #0009; padding: 1px 6px; border-radius: 4px; }
.vid .clickword { position: absolute; cursor: text; border-radius: 6px; }
.vid .clickword:hover { box-shadow: 0 0 0 1px #ffffff55; }
.vid .again { position: absolute; inset: 0; display: grid; place-items: center; background: #0006; animation: screenIn var(--dur-2); }
/* status pills sit bottom-left, 12 px above the bottom edge: on 9:16 that is the platform's caption zone
   (below y 1248), on 16:9 below 85% — the two places VibeCut never draws words, so they never cover the video's own */
.vid .pill, .vid .w-banner { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); z-index: 3; height: 30px; padding: 0 12px 0 10px; border-radius: 999px; background: #13110ee0; border: 1px solid #ffffff1a;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vid .pill .spin, .vid .w-banner .spin { width: 12px; height: 12px; }
.vid .overcard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #13110ee6; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-align: center; font-size: 13.5px; width: 78%; z-index: 3; }
.vid .muted-ic { position: absolute; right: 10px; bottom: 10px; width: 28px; height: 28px; border-radius: 50%; background: #0007; display: grid; place-items: center; z-index: 3; }
.transport { display: flex; align-items: center; gap: 14px; }
.transport .pp { width: 38px; height: 38px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; flex-shrink: 0; }
.transport .pp svg { width: 14px; height: 14px; }
.scrub { flex: 1; height: 26px; position: relative; display: flex; gap: 2px; align-items: center; cursor: pointer; }
.scrub .pb { height: 6px; border-radius: 3px; opacity: .38; position: relative; overflow: hidden; }
.scrub .pb.cur { opacity: 1; }
.scrub .pb.hatch { background: var(--hatch) !important; opacity: 1; }
.scrub .head { position: absolute; top: 3px; width: 2px; height: 20px; background: var(--text); border-radius: 2px; pointer-events: none; }
.time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ================================================================== S1 clips */
.page { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 72px 24px 60px; }
.col { width: 100%; max-width: 880px; }
.drop { margin-top: 32px; height: 240px; border: 1.5px dashed #463e34; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: border-color var(--dur-1), background var(--dur-1); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--accent-deep); background: #1a1d17; }
.drop h4 { font-family: var(--serif); font-weight: 500; font-size: 24px; }
.drop p { color: var(--muted); margin-top: 4px; }
.drop .btns { margin-top: 18px; display: flex; gap: 8px; justify-content: center; }
.reading { margin-top: 32px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-soft); padding: 22px 22px 20px; }
.reading .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.reading .row1 b { font-family: var(--serif); font-weight: 500; font-size: 22px; }
.reading .bar { margin: 14px 0 16px; }
.contact { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.contact img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 4px; opacity: 0; transform: scale(.96); transition: opacity .3s, transform .3s; }
.contact img.in { opacity: 1; transform: none; }
.reading .row2 { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
.notices { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.notices div::before { content: "·"; color: var(--warn); margin-right: 8px; }
.recent { margin-top: 36px; }
.recent .row { display: flex; gap: 18px; margin-top: 12px; }
.poster { width: 72px; cursor: pointer; }
.poster img { width: 72px; height: 128px; object-fit: cover; border-radius: 8px; box-shadow: 0 8px 20px #0006; transition: transform var(--dur-1); }
.poster:hover img { transform: translateY(-2px); }
.poster b { display: block; font-size: 12px; font-weight: 550; margin-top: 8px; line-height: 1.3; }
.poster small { color: var(--faint); font-size: 11px; }

/* ================================================================== S2 format */
.fmt-row { display: flex; gap: 20px; margin-top: 36px; justify-content: center; }
.fmt { position: relative; width: 330px; height: 380px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); display: flex; flex-direction: column; align-items: center; padding: 26px 22px 22px; text-align: center; transition: border-color var(--dur-1), background var(--dur-1), transform var(--dur-2) var(--ease); }
.fmt:hover { border-color: #4a4238; }
.fmt.sugg { border-color: var(--accent-deep); box-shadow: 0 0 0 4px var(--accent-glow); }
.fmt .sil { flex: none; height: 235px; display: grid; place-items: center; width: 100%; } /* every silhouette slot is 235 px so titles and estimates line up */
.fmt .sil img { object-fit: cover; border-radius: 8px; box-shadow: 0 16px 40px #0008; }
.fmt .sil .v { width: 132px; height: 235px; }
.fmt .sil .h { width: 290px; height: 163px; }
.fmt h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.1; margin-top: 14px; }
.fmt p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.fmt .est { font-family: var(--serif); font-size: 20px; margin-top: 6px; }
.fmt .est.w { color: var(--warn); font-size: 17px; }
.fmt .chip { position: absolute; top: 12px; right: 12px; background: #93b08826; color: var(--accent); }
.fmt-note { font-size: 13px; color: var(--warn); margin-top: 12px; line-height: 1.45; }
.fmt-notes { display: flex; gap: 20px; justify-content: center; }
.fmt-notes > div { width: 330px; }
.opt { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 26px; color: var(--muted); font-size: 13.5px; cursor: pointer; }

/* ================================================================== S3 vibe */
.vibe-page { flex: 1; overflow: auto; display: flex; flex-direction: column; }
.vibe-col { width: 100%; max-width: 1160px; margin: 0 auto; padding: 32px 24px 24px; flex: 1; }
.sentence { font-family: var(--serif); font-size: 30px; line-height: 1.2; font-weight: 400; }
.sentence b { font-weight: 500; font-style: italic; color: var(--accent); }
.evidence { font-size: 13px; color: var(--muted); margin-top: 6px; }
.kchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; position: relative; }
.kchip { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: all var(--dur-1); }
.kchip:hover { color: var(--text); border-color: #4a4238; }
.kchip.on { background: var(--raised); color: var(--text); border-color: var(--accent-deep); box-shadow: 0 0 0 3px var(--accent-glow), 0 6px 16px #0006; transform: translateY(-1px); }
.kchip.on::before { content: "✓"; color: var(--accent); font-size: 12px; }
.inline-row { display: flex; gap: 18px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.script-box { margin-top: 10px; width: 100%; max-width: 620px; height: 88px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; font-size: 13.5px; resize: vertical; outline: none; color: var(--text); }
.script-box:focus { border-color: var(--accent-deep); }
.vibe-head { margin-top: 26px; display: flex; align-items: baseline; gap: 16px; }
.vibe-head .sentence { font-size: 30px; }
.cards { display: flex; gap: 20px; margin-top: 18px; align-items: stretch; transition: opacity var(--dur-2); }
.cards.fading { opacity: 0; }
.vcard { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 240px; flex: 0 1 240px; min-width: 0; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 20px 20px 16px; text-align: left; transition: border-color var(--dur-1), box-shadow var(--dur-2), transform var(--dur-2) var(--ease); position: relative; }
.vcard:hover { border-color: #4a4238; }
.vcard.on { border-color: var(--accent-deep); box-shadow: 0 0 0 4px var(--accent-glow); }
.vcard .vid { width: auto; height: clamp(250px, calc(100vh - 584px), 356px); aspect-ratio: 9/16; align-self: center; border-radius: 12px; box-shadow: 0 16px 40px #0008; }
.vcard.wide { width: 340px; flex-basis: 340px; }
.vcard.wide .vid { width: 100%; height: auto; aspect-ratio: 16/9; }
.vcard h4 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin-top: 14px; display: flex; align-items: center; gap: 8px; line-height: 1.15; }
.vcard h4 .star { color: var(--accent-deep); font-size: 13px; font-family: var(--sans); }
.vcard p { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 3px; }
/* every card's line takes two lines' room, so the ♪ music lines share one baseline across the row */
.vcard .line { min-height: calc(2 * 1.4em); }
.vcard .ml { color: var(--faint); font-size: 12px; line-height: 1.35; margin-top: 6px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cards.more .vcard .ml { display: block; white-space: nowrap; text-overflow: ellipsis; }
.vcard .blank { position: absolute; inset: 0; display: grid; place-items: center; background: #15130f; color: var(--faint); font-size: 12.5px; text-align: center; padding: 20px; border-radius: 12px; }
.vcard .ontag { position: absolute; top: 28px; left: 28px; z-index: 5; }
.vcard .cardacts { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; }
.dashed { width: 200px; flex: 0 1 200px; border: 1.5px dashed #463e34; border-radius: var(--r-lg); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 22px; color: var(--muted); transition: border-color var(--dur-1), background var(--dur-1); }
.dashed:hover { border-color: var(--accent-deep); background: #1a1d17; color: var(--text); }
.dashed b { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--text); line-height: 1.15; }
.dashed small { font-size: 12.5px; margin-top: 8px; line-height: 1.4; }
.dashed .plus { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; margin-bottom: 14px; color: var(--accent-deep); }
.dashed.wide { width: 240px; flex-basis: 240px; }
.more-link { margin-top: 16px; font-size: 13px; }
.cards.more { margin-top: 14px; }
.cards.more .vcard { width: 192px; flex-basis: 192px; padding: 14px 14px 12px; }
.cards.more .vcard.wide { width: 272px; flex-basis: 272px; }
.cards.more .vcard h4 { font-size: 18px; }
.cards.more .vcard .vid { width: 100%; height: auto; }
.vtag { display: inline-block; align-self: flex-start; margin-top: 6px; font-size: 11px; color: var(--warn); background: #e9c78f18; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.bottom-bar { position: sticky; bottom: 0; height: 72px; flex-shrink: 0; border-top: 1px solid var(--line-soft); background: #13110ef2; backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 5; }
.bottom-bar .in { width: 100%; max-width: 1160px; padding: 0 24px; display: flex; align-items: center; gap: 16px; }
.bottom-bar .sum { font-size: 14px; color: var(--muted); }
.bottom-bar .sum b { color: var(--text); font-weight: 550; }

/* ================================================================== S4 making */
.making { flex: 1; background: var(--stage); display: flex; align-items: center; justify-content: center; overflow: auto; transition: opacity var(--dur-3) var(--ease); }
.making.out { opacity: 0; }
.mk-group { display: flex; align-items: flex-start; gap: 64px; padding: 24px; }
.mk-left { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.mk-frame { width: 315px; height: 560px; border-radius: 14px; }
.mk-frame.wide { width: 720px; height: 405px; }
/* exactly the frame's width; the newest shot arrives at the right and pushes older ones out to the left,
   under an 18 px fade — never clipped on the right */
.mk-strip { height: 56px; display: flex; justify-content: flex-end; width: 315px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 18px); mask-image: linear-gradient(to right, transparent, #000 18px); }
.mk-strip.wide { width: 720px; }
.mk-strip img { height: 56px; width: 0; margin-left: 0; object-fit: cover; border-radius: 4px; flex-shrink: 0; opacity: 0; transition: opacity .35s var(--ease), width .45s var(--ease), margin .45s var(--ease); }
.mk-strip img.in { opacity: 1; width: 31.5px; margin-left: 3px; }
.mk-strip.wide img.in { width: 42px; }
.mk-col { width: 380px; padding-top: 6px; }
.mk-col .hd { display: flex; align-items: baseline; justify-content: space-between; }
.mk-col h2 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.1; }
.mk-col .tl { color: var(--muted); margin-top: 6px; font-size: 14px; }
.cl { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.cl li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--faint); transition: color var(--dur-2); }
.cl li .c { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #463e34; flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; font-size: 11px; transition: all var(--dur-2); }
.cl li.now { color: var(--text); }
.cl li.now .c { border: 0; }
.cl li.done { color: var(--muted); }
.cl li.done .c { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--accent-ink); }
.cl li.warnl { color: var(--warn); }
.cl li.warnl.done .c { background: var(--warn); border-color: var(--warn); }
.mk-frame .grading { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #fff9; box-shadow: 0 0 12px #fff6; pointer-events: none; }
.mk-frame .ungraded { position: absolute; inset: 0; pointer-events: none; }

/* ================================================================== S5 watch */
.watch { flex: 1; background: var(--stage); overflow: auto; display: flex; flex-direction: column; align-items: stretch; }
.w-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: 24px 24px 28px; flex: 1; }
.w-center { display: flex; flex-direction: column; align-items: center; min-width: 0; position: relative; }
.w-vid { height: min(560px, calc(100vh - 360px)); aspect-ratio: 9/16; min-height: 360px; }
.w-vid.wide { height: auto; width: min(880px, calc(100vw - 560px), calc((100vh - 360px) * 16 / 9)); aspect-ratio: 16/9; min-height: 0; }
.w-transport { margin-top: 14px; min-width: 520px; }
.w-info { margin-top: 18px; text-align: center; max-width: 640px; }
.w-title { font-family: var(--serif); font-size: 30px; line-height: 1.15; outline: none; border-radius: 8px; padding: 0 6px; cursor: text; display: inline-block; }
.w-title:hover { background: #ffffff08; }
.w-title:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--accent-deep); }
.w-quiet { font-size: 13px; color: var(--muted); margin-top: 4px; }
.w-chips { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; position: relative; }
.w-chips .chip { height: 30px; padding: 0 13px; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; }
.w-chips .chip.on { border-color: var(--line); color: var(--text); }
.w-btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
/* "What I did": the mirror of the Another-vibe column, 32 px left of the video, vertically centred on it */
.w-did { position: absolute; top: 0; width: 280px; z-index: 2; }
.did { text-align: left; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; padding: 12px 16px 12px; animation: screenIn var(--dur-2); max-height: calc(100vh - 110px); overflow: auto; }
.did .caps { display: block; margin-bottom: 4px; }
.did li { list-style: none; font-size: 13px; color: var(--muted); padding: 5px 0 5px 18px; position: relative; line-height: 1.45; }
.did li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); font-size: 11px; top: 7px; }
.did li.nc::before { content: "○"; color: var(--faint); }
.did li.src::before { content: "i"; font-style: italic; font-family: var(--serif); color: var(--faint); }
/* a known problem never gets a tick: it gets the warning mark and a way to look at it */
.did li.wl { color: var(--warn); }
.did li.wl::before { content: "▲"; color: var(--warn); font-size: 9px; top: 8px; }
.did li.wl .link { color: var(--warn); text-decoration-color: #e9c78f66; }
.w-side { position: absolute; top: 0; left: 100%; width: 200px; }
.w-side .col200 { width: 200px; display: flex; flex-direction: column; gap: 14px; }
.w-side .alt { display: flex; gap: 12px; align-items: center; text-align: left; border-radius: 12px; padding: 6px; margin: -6px; transition: background var(--dur-1); }
.w-side .alt:hover { background: #ffffff08; }
.w-side .alt .th { width: 96px; height: 170px; border-radius: 10px; box-shadow: 0 10px 30px #0008; flex-shrink: 0; pointer-events: none; }
.w-side .alt.wide .th { width: 170px; height: 96px; }
.w-side .alt b { font-family: var(--serif); font-weight: 500; font-size: 20px; display: block; }
.w-side .alt small { color: var(--faint); font-size: 12px; line-height: 1.35; display: block; margin-top: 2px; }
.w-side .alt.wide { flex-direction: column; align-items: flex-start; gap: 6px; }
.lo-pop { width: 420px; padding: 16px; --tw: 96px; }
.lo-pop h4 { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.15; }
.lo-grid { display: grid; grid-template-columns: repeat(3, 96px); gap: 12px; margin-top: 12px; justify-content: center; }
.lo { font-size: 11px; color: var(--muted); line-height: 1.3; min-width: 0; }
.lo .th { position: relative; width: var(--tw); height: calc(var(--tw) * 16 / 9); border-radius: 8px; overflow: hidden; }
.lo .th img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.55) brightness(.72); transition: filter var(--dur-2); }
.lo.used .th img { filter: none; }
.lo .th .btn { position: absolute; left: 5px; right: 5px; bottom: 5px; padding: 0 6px; }
.lo p { margin-top: 5px; height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.check-card { position: absolute; z-index: 4; background: #13110ef0; border: 1px solid var(--warn); border-radius: 12px; padding: 12px 14px; width: 290px; max-width: 92%; font-size: 13px; box-shadow: 0 20px 50px #000a; }
.check-card b { color: var(--warn); font-weight: 550; }
.check-card .acts { display: flex; gap: 6px; margin-top: 10px; }

/* ================================================================== S6 editor */
.editor { flex: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--panel); min-height: 0; position: relative; }
.editor.yt { grid-template-columns: minmax(0, 1fr) var(--panel); }
.rail { border-right: 1px solid var(--line-soft); overflow: auto; padding: 16px 12px 24px; min-height: 0; position: relative; }
.editor.yt .rail { display: none; }
.rail.overlay { display: block !important; position: absolute; left: 0; top: 0; bottom: 0; width: 300px; z-index: 20; background: var(--bg); box-shadow: 20px 0 60px #000a; animation: railIn var(--dur-2) var(--ease); }
@keyframes railIn { from { transform: translateX(-20px); opacity: 0; } }
.rail-h { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 4px; position: relative; }
.part { margin-top: 8px; border-radius: var(--r); padding: 10px 10px 10px 12px; cursor: pointer; transition: background var(--dur-1), transform var(--dur-2) var(--ease); position: relative; border: 1px solid transparent; }
.part:hover { background: var(--surface); }
.part.sel { background: var(--raised); border-color: #3c352c; box-shadow: 0 6px 18px #0005; }
.part.dragging { opacity: .4; }
.part.dropbefore::before { content: ""; position: absolute; left: 6px; right: 6px; top: -5px; height: 2px; border-radius: 2px; background: var(--accent); }
.part.dropafter::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -5px; height: 2px; border-radius: 2px; background: var(--accent); }
.part .handle { position: absolute; left: -2px; top: 12px; color: var(--faint); font-size: 12px; letter-spacing: -2px; opacity: 0; cursor: grab; padding: 0 2px; }
.part:hover .handle { opacity: 1; }
.part .t { display: flex; align-items: baseline; gap: 8px; }
.part .t .sw { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; transform: translateY(-2px); }
.part .t b { font-family: var(--serif); font-weight: 500; font-size: 18px; }
.part .t .len { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.part .shots { display: flex; gap: 3px; margin-top: 8px; }
.part .shots img { width: 30px; height: 53px; object-fit: cover; border-radius: 3px; }
.part .words { font-size: 12px; color: var(--accent-deep); margin-top: 6px; }
.addpart { margin-top: 10px; width: 100%; justify-content: flex-start; }
.center { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) var(--strip) var(--hist) var(--ask); padding-bottom: 8px; min-height: 0; min-width: 0; position: relative; }
.center.frames-mode { grid-template-rows: minmax(0, 1fr) 240px; padding-bottom: 0; }
.stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 52px 20px 10px; min-height: 0; }
.stage .e-vid { height: min(calc(100% - 64px), 600px); aspect-ratio: 9/16; }
.stage .e-vid.wide { height: auto; width: min(calc(100% - 8px), 900px); aspect-ratio: 16/9; max-height: calc(100% - 64px); }
.stage .e-transport { width: min(100%, 520px); }
.stage-tl { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; z-index: 6; }
.stage-tr { position: absolute; right: 16px; top: 14px; z-index: 6; }
.vpill { height: 30px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); padding: 0 12px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.vpill:hover { border-color: #4a4238; }
.vpill .dot { width: 8px; height: 8px; border-radius: 50%; }
.preview-bar { display: flex; align-items: center; gap: 12px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; }
/* story strip */
.strip { margin: 0 20px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 8px; }
.strip .marks { position: relative; height: 16px; }
.strip .marks button { position: absolute; top: 0; transform: translateX(-50%); font-size: 9.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-deep); border-radius: 4px; height: 13px; line-height: 13px; padding: 0 3px; opacity: .85; }
.strip .marks button:hover, .strip .marks button.sel { opacity: 1; background: var(--accent); }
.strip .marks button.warnm { background: var(--warn); }
.strip .blocks { display: flex; gap: 2px; height: 16px; }
.strip .blocks button { border-radius: 4px 4px 0 0; font-size: 10.5px; color: var(--accent-ink); padding: 0 6px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-weight: 550; opacity: .75; }
.strip .blocks button.sel { opacity: 1; }
.strip .film { display: flex; gap: 2px; height: 38px; }
.strip .film .pf { display: flex; gap: 1px; overflow: hidden; border-radius: 0 0 6px 6px; }
.strip .film img { height: 100%; flex: 1; min-width: 0; object-fit: cover; }
.strip .ph { position: absolute; top: 12px; bottom: 4px; width: 2px; background: var(--text); border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 1px #0006; }
.strip .ph::before { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 6px; background: var(--text); border-radius: 2px; }
/* history line + drawer */
.histline { margin: 0 20px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.histline .last { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.histline .last .ic { color: var(--accent-deep); margin-right: 6px; }
.drawer { position: absolute; left: 12px; right: 12px; bottom: calc(var(--ask) + 8px + var(--hist)); max-height: 55%; background: #1c1916f7; border: 1px solid var(--line); border-radius: 16px 16px 12px 12px; box-shadow: 0 -20px 60px #000a; display: flex; flex-direction: column; z-index: 15; animation: drawerIn var(--dur-2) var(--ease); backdrop-filter: blur(8px); }
@keyframes drawerIn { from { transform: translateY(24px); opacity: 0; } }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; border-bottom: 1px solid var(--line-soft); }
.drawer .dl { overflow: auto; padding: 6px 8px 10px; }
.turn { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 10px; border-radius: 10px; }
.turn:hover { background: #ffffff06; }
.turn .ic { color: var(--accent-deep); font-size: 12px; padding-top: 2px; text-align: center; }
.turn .l1 { font-size: 13.5px; }
.turn .df { grid-column: 2; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.turn .rb { grid-column: 3; grid-row: 1; }
.turn.undone .l1, .turn.undone .df { color: var(--faint); text-decoration: line-through; text-decoration-color: #72695d99; }
.turn.skipped .l1, .turn.skipped .df { color: var(--faint); text-decoration: line-through; }
.turn .skiptag { grid-column: 2; font-size: 11.5px; color: var(--warn); }
.turn .rem { grid-column: 2; display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
.turn .rem .chip { height: 24px; font-size: 11.5px; cursor: pointer; }
.turn .rem .chip.on { background: #93b08826; color: var(--accent); }
.turn .remform { grid-column: 2; display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--faint); }
.turn .remform input { height: 28px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); padding: 0 10px; color: var(--text); font-size: 12.5px; outline: none; }
.turn .sugg { grid-column: 2; display: flex; gap: 6px; margin-top: 6px; }
.turn.fail .ic { color: var(--warn); }
.turn.divider { grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 10px; }
.turn.divider::before, .turn.divider::after { content: ""; height: 1px; background: var(--line); }
.turn.divider > div { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
/* ask bar */
.ask { margin: 0 20px; height: var(--ask); border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 18px; }
.ask:focus-within { border-color: var(--accent-deep); box-shadow: 0 0 0 3px var(--accent-glow); }
.ask input { flex: 1; background: none; border: 0; outline: none; color: var(--text); font-size: 14.5px; min-width: 0; }
.ask input::placeholder { color: var(--faint); }
.ask .spark { color: var(--accent); }
.ask.off { opacity: .7; }
.ask.off input::placeholder { color: var(--muted); }
/* panel */
.panel { border-left: 1px solid var(--line-soft); overflow: auto; padding: 16px 18px 28px; min-height: 0; position: relative; }
.panel h4 { font-family: var(--serif); font-weight: 500; font-size: 24px; line-height: 1.15; }
.panel .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.panel .body { margin-top: 18px; }
.editable { outline: none; border-radius: 6px; cursor: text; }
.editable:hover { background: #ffffff08; }
.editable:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--accent-deep); }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 14px 12px; align-items: center; margin-top: 18px; font-size: 13px; }
.kv > span { color: var(--faint); }
.shotgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 78px)); gap: 6px; margin-top: 14px; }
.shotgrid .sh { position: relative; width: 100%; aspect-ratio: 78 / 139; border-radius: 7px; overflow: hidden; cursor: pointer; }
.shotgrid .sh img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-2) var(--ease); }
.shotgrid .sh:hover img { transform: scale(1.04); }
.shotgrid .sh .dur { position: absolute; left: 4px; bottom: 4px; font-size: 10px; background: #000a; padding: 0 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.shotgrid .sh.sel { box-shadow: 0 0 0 2px var(--accent); }
.shotgrid.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; max-height: 300px; overflow: auto; border-radius: 8px; }
.shotgrid.wide.fadeb { -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent); mask-image: linear-gradient(#000 calc(100% - 28px), transparent); }
.shotgrid.wide .sh { aspect-ratio: 16 / 9; border-radius: 5px; }
.shotgrid .sh .hook { position: absolute; left: 4px; top: 4px; font-size: 9.5px; background: var(--accent); color: var(--accent-ink); padding: 0 5px; border-radius: 4px; font-weight: 650; }
.stops { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 8px; }
.moment { margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-soft); font-size: 13px; }
.moment .row { display: flex; align-items: center; gap: 10px; }
.swaplist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.swaplist .so { text-align: center; font-size: 11px; color: var(--muted); }
.swaplist .so img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 6px; }
.swaplist .so .btn { margin-top: 4px; width: 100%; }
.wlist { list-style: none; margin-top: 10px; }
.wrow { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: var(--r); cursor: pointer; position: relative; }
.wrow:hover { background: var(--surface); }
.wrow.sel { background: var(--raised); }
.wrow.gone { display: none; }
.wrow .ic { width: 26px; height: 26px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-size: 12.5px; color: var(--accent); flex-shrink: 0; }
.wrow.sel .ic { background: var(--bg); }
.wrow .txt { flex: 1; min-width: 0; }
.wrow .txt b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .txt b.unnamed { color: var(--accent-deep); font-weight: 500; font-style: italic; }
.wrow .txt small { color: var(--faint); font-size: 12px; }
.wrow .wwarn { color: var(--warn); font-size: 12px; margin-top: 2px; }
.wrow .del { position: absolute; right: 8px; top: 10px; width: 22px; height: 22px; border-radius: 50%; color: var(--faint); opacity: 0; }
.wrow:hover .del { opacity: 1; }
.wrow .del:hover { background: var(--hover); color: var(--text); }
.swatch { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px #ffffff22; display: inline-block; cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent-deep); }
.style-box { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-soft); }
.style-box .kv { margin-top: 0; }
/* transcript */
.tx-para { font-family: var(--serif); font-size: 20px; line-height: 1.7; margin-top: 16px; position: relative; border-radius: 8px; padding: 2px 6px; margin-left: -6px; }
.tx-para:hover { background: #ffffff05; }
.tx-para .ts { font-family: var(--sans); font-size: 11px; color: var(--faint); display: block; line-height: 1; margin-bottom: 2px; }
.tx-para .cover { position: absolute; right: 4px; top: 0; font-family: var(--sans); font-size: 11px; opacity: 0; }
.tx-para:hover .cover { opacity: 1; }
.cut { color: var(--faint); text-decoration: line-through; text-decoration-color: #e59c8f99; cursor: pointer; }
.cut:hover { color: var(--muted); }
.cut.back { color: var(--text); text-decoration: none; background: #93b0881f; border-radius: 4px; }
.rtag { font-family: var(--sans); font-size: 10.5px; color: var(--danger); background: #e59c8f14; border-radius: 999px; padding: 1px 7px; vertical-align: 3px; margin: 0 3px; white-space: nowrap; cursor: pointer; }
.cut.back + .rtag { opacity: .6; color: var(--muted); background: var(--surface); }
.pause { display: inline-block; font-family: var(--sans); font-size: 10.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 999px; padding: 0 7px; line-height: 18px; vertical-align: 3px; margin: 0 3px; cursor: pointer; }
.pause.back { color: var(--text); border-color: var(--accent-deep); }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.legend .chip { cursor: pointer; border: 1px solid transparent; }
.legend .chip.on { background: #3a2622; color: var(--danger); }
.legend .chip.on b { color: var(--danger); }
/* music */
.np { margin-top: 16px; background: var(--raised); border-radius: 12px; padding: 14px; border: 1px solid #3a332b; }
.np .row { display: flex; gap: 12px; align-items: center; }
.np .cover { width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0; position: relative; overflow: hidden; }
.np .why { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.45; }
.np .wave { margin-top: 12px; position: relative; }
.np canvas { width: 100%; height: 40px; }
.np .pblocks { display: flex; gap: 1px; height: 5px; margin-top: 3px; border-radius: 3px; overflow: hidden; }
.np .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); margin-top: 8px; }
/* 64 px rows: line 1 is the title with its badge right after it; line 2 is "artist · reason" on one line */
.trk { display: grid; grid-template-columns: 28px minmax(0, 1fr) 48px auto; gap: 6px; align-items: center; height: 64px; padding: 0 4px 0 6px; border-radius: 10px; }
.trk > .btn-sm { padding: 0 11px; }
.trk:hover { background: var(--surface); }
.trk .pl { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--muted); position: relative; }
.trk .pl:hover { color: var(--text); border-color: var(--muted); }
.trk .pl svg.ring { position: absolute; inset: -3px; width: 34px; height: 34px; transform: rotate(-90deg); }
.trk .nm { min-width: 0; }
.trk .nm .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.trk .nm b { font-size: 13px; font-weight: 600; line-height: 1.45; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk .nm .l1 .badge { flex: none; }
.trk .nm .rs { font-size: 12px; color: var(--faint); line-height: 1.45; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk .nm .rs i { font-style: normal; color: var(--muted); }
.trk .nm .rs i.out { color: var(--warn); }
.trk canvas { width: 48px; height: 20px; }
.trk.previewing { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.badge { font-size: 10px; padding: 0 6px; border-radius: 999px; height: 16px; line-height: 16px; background: var(--raised); color: var(--muted); flex-shrink: 0; white-space: nowrap; }
.badge.yours { background: #93b08826; color: var(--accent); }
.badge.free { background: #e9c78f1c; color: var(--warn); }
.inline-ask { margin: 0 6px 8px 44px; font-size: 12.5px; color: var(--warn); background: #e9c78f10; border: 1px solid #e9c78f33; border-radius: 10px; padding: 10px 12px; }
.inline-ask .acts { display: flex; gap: 6px; margin-top: 8px; }
.mfoot { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
.state-line { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.state-line.w { color: var(--warn); border-color: #e9c78f33; }

/* ================================================================== S7 frames */
.tline { border-top: 1px solid var(--line-soft); padding: 8px 20px 10px; position: relative; user-select: none; background: #110f0d; }
.tline .lab { position: absolute; left: 4px; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; writing-mode: vertical-rl; transform: rotate(180deg); }
/* long edits open zoomed (about a minute on screen) and scroll sideways; the zoom chips sit at the ruler's right */
.tl-scroll { overflow-x: auto; overflow-y: hidden; }
.tl-scroll::-webkit-scrollbar { height: 8px; }
.tl-scroll::-webkit-scrollbar-thumb { background: #3a332b; border-radius: 8px; }
.tl-scroll::-webkit-scrollbar-track { background: transparent; }
.tl-inner { position: relative; min-width: 100%; }
.tl-zoom { position: absolute; right: 20px; top: 8px; z-index: 7; display: flex; align-items: center; gap: 2px; padding-left: 24px; background: linear-gradient(to right, #110f0d00, #110f0d 22px); }
.tl-zoom button { height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; color: var(--muted); }
.tl-zoom button.on { background: var(--raised); color: var(--text); }
.tl-zoom button:hover:not(.on) { color: var(--text); }
.tline .ruler { height: 24px; position: relative; border-bottom: 1px solid var(--line-soft); }
.tline .ruler span { position: absolute; top: 4px; font-size: 10.5px; color: var(--faint); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.tline .ruler i { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--line); }
.tline .trk-pic { height: 72px; position: relative; margin-top: 8px; }
.tline .trk-words { height: 32px; position: relative; margin-top: 6px; }
.tline .trk-mus { height: 48px; position: relative; margin-top: 6px; }
.tl-shot { position: absolute; top: 0; bottom: 0; border-radius: 6px; overflow: hidden; cursor: pointer; background-size: auto 100%; background-repeat: repeat-x; border: 1px solid #0006; }
.tl-shot span { position: absolute; left: 4px; bottom: 3px; font-size: 10px; background: #000b; padding: 0 4px; border-radius: 3px; white-space: nowrap; max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; }
.tl-shot.sel { box-shadow: inset 0 0 0 2px var(--accent); }
/* shots under 72 px show their name only on hover or when selected */
.tl-shot.narrow span { display: none; }
.tl-shot.narrow:hover, .tl-shot.narrow.sel { overflow: visible; z-index: 4; }
.tl-shot.narrow:hover span, .tl-shot.narrow.sel span { display: block; max-width: none; box-shadow: 0 4px 12px #000a; }
.tl-join { position: absolute; top: -9px; transform: translateX(-50%); font-size: 9.5px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 13px; white-space: nowrap; z-index: 2; }
.tl-join.sp { color: var(--warn); border-color: #e9c78f55; }
.tl-word { position: absolute; top: 4px; bottom: 4px; border-radius: 5px; background: #93b08833; border: 1px solid #93b08866; font-size: 10.5px; color: var(--accent); padding: 0 6px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-word.glyph { padding: 0 2px; text-align: center; text-overflow: clip; font-size: 11.5px; letter-spacing: .04em; }
.tl-ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); z-index: 5; cursor: ew-resize; }
.tl-ph::before { content: ""; position: absolute; top: 0; left: -6px; width: 14px; height: 12px; background: var(--text); border-radius: 3px 3px 7px 7px; }
.tl-ph.snapped::before { background: var(--accent); }
.tl-ticks i { position: absolute; top: 24px; bottom: 0; width: 1px; pointer-events: none; }
.tl-ticks i.cut { background: #efe8dd1c; }
.tl-ticks i.beat { top: auto; height: 48px; background: #93b0882e; }
.tl-ticks i.mov { top: 24px; height: 8px; background: var(--warn); opacity: .6; }
.frame-panel .fp-h { font-family: var(--serif); font-size: 22px; line-height: 1.15; }
.frame-panel .fp-sub { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.frame-panel .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.frame-panel .acts .btn { justify-content: flex-start; }
.frame-panel kbd { font-family: var(--sans); font-size: 11px; color: var(--faint); margin-left: auto; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

/* ================================================================== S8 export */
.exp { width: 800px; height: 560px; display: grid; grid-template-columns: 260px 1fr; }
.exp .post { background: #000; position: relative; overflow: hidden; }
/* the poster is a frame of the real edit: shot 1 with the vibe's own hook line (drawn, not a burned-in still) */
.exp .post .vid { position: absolute; top: 0; left: calc(50% - 157.5px); width: 315px; height: 560px; border-radius: 0; box-shadow: none; }
/* YouTube: a 16:9 frame, vertically centred in the column, frozen on part title 1 (YouTube has no hook line) */
.exp .post .vid.wide { top: calc(50% - 73px); left: 0; width: 260px; height: 146px; }
.exp .post .facebox span { top: auto; bottom: -22px; }
/* while Look is open, the poster column becomes the left-out panel, so the checklist never scrolls */
.exp .post.lp { background: #171411; border-right: 1px solid var(--line-soft); padding: 22px 24px; overflow: auto; }
.lp-h { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; font-size: 12px; color: var(--faint); }
.lp-h b { font-weight: 600; color: var(--text); }
.lp-h .link { font-size: 12px; }
.lp-grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 12px 10px; margin-top: 12px; }
.lp-th { position: relative; width: 64px; height: 114px; border-radius: 6px; overflow: hidden; background: #000; }
.lp-th img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.6) brightness(.8); transition: filter var(--dur-2); }
.lp.use .lp-th img { filter: none; }
.lp-b { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 6px; }
.lp-btn { width: 22px; height: 22px; border-radius: 50%; background: #13110ee6; border: 1px solid #ffffff33; color: var(--text); font-size: 12px; line-height: 1; display: grid; place-items: center; transition: background var(--dur-1), color var(--dur-1); }
.lp-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lp-ans { position: absolute; left: 4px; right: 4px; bottom: 5px; height: 20px; line-height: 20px; border-radius: 999px; background: #13110ee6; text-align: center; font-size: 10.5px; color: var(--ok); white-space: nowrap; }
.lp.keep .lp-ans { color: var(--muted); }
.lp-why { font-size: 11px; line-height: 1.25; color: var(--muted); margin-top: 5px; height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.exp .body { padding: 28px; display: flex; flex-direction: column; min-height: 0; }
.exp .scrollb { overflow: auto; margin: 0 -28px; padding: 0 28px 4px; flex: 1; min-height: 0; }
/* a cue that the list goes on: the last 28 px fade while there is more below */
.exp .scrollb.fadeb { -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent); mask-image: linear-gradient(#000 calc(100% - 28px), transparent); }
.exp .seg.full { display: flex; width: 100%; }
.exp .seg.full button { flex: 1; height: 30px; font-size: 13px; }
.exp h2 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.1; margin-top: 6px; }
.exp .fl { color: var(--muted); font-size: 13px; margin-top: 4px; }
.exp .sec { margin-top: 18px; }
.exp .sec > .caps { margin-bottom: 8px; display: block; }
.exp .note { font-size: 12.5px; color: var(--muted); background: var(--raised); border-radius: 10px; padding: 9px 12px; margin-top: 8px; line-height: 1.45; }
.gate { display: flex; flex-direction: column; }
.gi { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; line-height: 1.45; }
.gi:last-child { border-bottom: 0; }
.gi .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--faint); }
.gi .dot.dw { background: var(--warn); } .gi .dot.dk { background: var(--ok); }
.gi .grow { flex: 1; min-width: 0; }
.gi .tick { color: var(--ok); font-size: 12px; }
.golist { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; margin: 10px 0 4px; }
/* tile, its two buttons beside it, then a 2-line reason under the tile */
.go { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 8px; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.go img { width: 64px; height: 114px; object-fit: cover; border-radius: 6px; filter: saturate(.6) brightness(.8); }
.go.ans img { filter: none; }
.go .gb { display: flex; flex-direction: column; gap: 4px; justify-content: flex-end; }
.go .gb .btn { height: 24px; padding: 0 9px; font-size: 11.5px; }
.go .why { grid-column: 1 / -1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 30px; }
.go .ansl { color: var(--ok); align-self: end; }
.exp .foot { padding-top: 14px; }
.exp .helper { font-size: 12.5px; color: var(--warn); margin-bottom: 8px; text-align: right; }
.exp .btnrow { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.files { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.files > div { display: flex; gap: 12px; align-items: center; font-size: 13.5px; }
.files .fth { position: relative; width: 28px; height: 50px; border-radius: 4px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px #ffffff14, 0 4px 10px #0006; background: #000; }
.files .fth img { width: 100%; height: 100%; object-fit: cover; }

/* ------------------------------------------------------------ easing (cubic-bezier solver) */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const sx = (t) => ((ax * t + bx) * t + cx) * t
  const sy = (t) => ((ay * t + by) * t + cy) * t
  const dx = (t) => (3 * ax * t + 2 * bx) * t + cx
  return (x) => {
    if (x <= 0) return 0
    if (x >= 1) return 1
    let t = x
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - x
      if (Math.abs(e) < 1e-5) return sy(t)
      const d = dx(t)
      if (Math.abs(d) < 1e-6) break
      t -= e / d
    }
    let lo = 0, hi = 1
    t = x
    for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-5) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2 }
    return sy(t)
  }
}

/* ------------------------------------------------------------ joins: budget-capped, per vibe (§4.4, §4.6) */
function resolveJoins(b, fl) {
  const L = LOOKS[b.look], K = KINDS[b.kind], n = b.parts.length - 1

  if (b.fmt !== 'short') cap = Math.min(cap, Math.floor(fl.total / 75)) // long formats: at most 1 special join per 60–90 s
  cap = clamp(cap, 0, n)
  const slots = new Set()
  for (let j = 0; j < cap; j++) slots.add(Math.min(n - 1, Math.round(((j + 0.5) * n) / cap - 0.5)))
  const out = []
  for (let k = 0; k < n; k++) {
    let type = 'cut', fell = false
    const want = L.partJoin
    if (slots.has(k) && L.specialJoin) type = L.specialJoin
    else if (SPECIAL.has(want)) { if (slots.has(k)) type = want; else if (K.soft && vid(L) === 'film') type = 'dip' }
    else if (want === 'fade') {
      if (K.soft) { if (k === 1) type = 'fade'; else { type = 'dip'; fell = true } } // spare footage both sides at only 1 of the part changes
      else if (slots.has(k) && L.fallback) type = L.fallback
    } else if (want === 'dip' && K.soft) type = 'dip'
    out.push({ k, type, fell })
  }
  return out

function joinName(type, L) {

  if (type === 'leak') return vid(L) === 'cozy' ? 'warm light leak' : 'light leak'
  if (type === 'flash') return vid(L) === 'playful' ? 'pastel flash' : 'white flash'
  return JOIN_WORD[type] || type
}
function camPlan(b, fl) {
  const L = LOOKS[b.look], K = KINDS[b.kind], n = fl.shots.length
  const frac = { fast_day: 0.2, quiet_day: 0.3, trip: 0.25, places_guide: 0.2, talking: 0, story_day: 0.2 }[b.kind]

  const at = b.kind === 'talking' ? [0.15, 0.45, 0.8] : [0.55, 0.8, 0.3]
  for (let j = 0; j < zc; j++) { const s = fl.shots[Math.min(n - 1, Math.floor(at[j] * n))]; if (s) zoom.add(s.id) }

  if (P.push.has(s.id)) z = lerp(1, L.push, EASE.inout(clamp(u / s.d)))
  if (P.zoom.has(s.id) && u > s.d * 0.45) { // zoom-in lands on a beat, no transition; face-anchored

function drawMusic() {

    for (let i = 0; i < n; i++) {
      const u = i / n, e = T.e[Math.min(9, Math.floor(u * 10))], h = (0.25 + e * 0.75) * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.37))) * H

  })
}
