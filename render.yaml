# One click on Render: New → Blueprint, pick this repo. Starter instance
# plus a 10 GB disk, because phone clips are big and the free plan has no
# disk (every upload would vanish on restart). AI stays off: no key here.
services:
  - type: web
    name: vibecut
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /api/ai
    disk:
      name: vibecut-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: VIBECUT_CACHE
        value: /data/cache
      - key: VIBECUT_EXPORTS
        value: /data/exports
